[env:nano]
platform = atmelavr
board = nanoatmega328        ; si el upload falla, probá nanoatmega328new (bootloader nuevo)
framework = arduino
monitor_speed = 115200
monitor_eol = LF             ; los comandos (setpoint, P/I/D) necesitan fin de línea
monitor_echo = yes
lib_deps =
    marcoschwartz/LiquidCrystal_I2C@^1.1.4
