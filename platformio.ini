[env:nanoatmega328new]
platform = atmelavr
board = nanoatmega328new
framework = arduino
monitor_speed = 115200
monitor_eol = LF             ; los comandos (setpoint, P/I/D) necesitan fin de línea
monitor_echo = yes
monitor_filters = default, log2file   ; además de mostrarlo, guarda todo en un .log en la carpeta del proyecto
; el LCD usa un driver propio (en main.cpp): no hace falta ninguna biblioteca externa

